# forge-toolchain: 59
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# uv runs on this Python rather than whatever the runner happens to
# have. It is the highest requires-python floor among the components.
env:
  UV_PYTHON: "3.11"

jobs:

  python:
    name: "Python tests"
    runs-on: ubuntu-26.04
    steps:

      - name: Check out the commit
        uses: actions/checkout@v7

      # > custom:before:python - reach the private dependencies
      # checkout attaches the job token to this repo's gitdir alone, through an
      # includeIf. uv resolves `lakeworks` by cloning into its own cache, where
      # that scoping does not reach, and git then asks for a username on a
      # terminal that is not there.
      #
      # Rewriting the URL carries the token into every clone the job makes,
      # whatever tool starts it. --global lands in the temporary config
      # checkout points GIT_CONFIG_GLOBAL at, so nothing survives the job.
      - name: Carry the job token into nested clones
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # generated:python
      # enable-cache is left at setup-uv's `auto`, which caches on a hosted
      # runner only. Every repo's self-hosted runner shares one ~/.cache/uv
      # that outlives the job, so there the post step's prune and upload are
      # work the disk already did, and two jobs pruning at once collide on the
      # same files. version is the release the uv-lock hook pins, so the sync
      # here and the lock check in the hooks job run one uv.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"

      - run: uv sync --all-extras --dev

      # --with pytest, so a repo whose suite never declared pytest as a
      # dependency still runs it rather than skipping it. A suite needing
      # plugins declares those itself.
      #
      # pytest exits 5 when it collects nothing, which is not a failure for a
      # repo that has no tests yet. Written explicitly rather than as an && chain
      # because the runner uses `bash -e`, where the concise form depends on
      # subtle errexit-exemption rules.
      - name: Test
        run: |
          set +e
          uv run --with pytest pytest
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then exit 0; fi
          exit 1

  terraform-infra:
    name: "Terraform tests in infra"
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: infra
    steps:

      - name: Check out the commit
        uses: actions/checkout@v7

      # > custom:before:terraform-infra - reach the private module
      # `terraform init` clones the naming module into .terraform/modules,
      # which is a new repository and so outside the includeIf checkout scopes
      # the job token to.
      - name: Carry the job token into nested clones
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # generated:terraform-infra
      # Shared by the terraform job and the hooks job, whose terraform_fmt and
      # terraform_validate hooks call the terraform on PATH.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # init without a backend: the tests need the providers resolved, and no
      # PR check should be touching real state.
      - run: terraform init -backend=false

      # Unconditional: with no .tftest.hcl files this exits 0 reporting
      # "0 passed, 0 failed", so a repo without tests is unaffected.
      - run: terraform test

  hooks:
    name: "Pre-commit hooks"
    runs-on: ubuntu-26.04
    steps:

      - name: Check out the commit
        uses: actions/checkout@v7

      # > custom:before:hooks - reach the private dependencies
      # The mypy hook syncs the project, which clones `lakeworks`, and
      # terraform_validate initializes infra, which clones the naming module.
      # Both are nested clones the job token does not reach without this.
      - name: Carry the job token into nested clones
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # generated:hooks
      # Shared by the terraform job and the hooks job, whose terraform_fmt and
      # terraform_validate hooks call the terraform on PATH.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # Every hook in the repo's committed pre-commit config. A push from a
      # checkout that never ran `pre-commit
      # install`, or a merge in the web UI, passes every hook by not running it,
      # and this is the gate that catches both. CI runs the hooks themselves
      # rather than copies of their checks, because a copy is a second spelling
      # of the check that drifts from the first.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"

      # pre-commit takes a `language: node` hook's Node from PATH where node and
      # npm are there, and otherwise downloads the newest release. That release
      # can need libraries a runner image lacks, as Node 25 needs libatomic. So
      # the job puts the declared Node on PATH, on every runner alike.
      - name: Install Node for the hooks
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # A self-hosted runner keeps ~/.cache/pre-commit between jobs, so there
      # the archive is a download of what is already on disk.
      - name: Restore the pre-commit cache
        uses: actions/cache@v6
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The bats hook is `language: system`, so bats has to be on PATH. Every
      # config carries the hook, and the step does nothing where there are no
      # suites.
      #
      # All three are cloned at a tag rather than from main: a test harness
      # that moves on its own turns an unrelated upstream change into a failing
      # build, and nothing records which version a green run used.
      #
      # bats-core runs from its clone in RUNNER_TEMP, by PATH. Installed into
      # /usr/local, it would be one copy every runner on a self-hosted box
      # rewrites while the others execute it.
      #
      # The helper libraries go under ~/.local/lib because that is where the
      # suites `load` them from — the same path they use on a workstation, so a
      # test cannot pass locally and fail here over a lookup path. The suites
      # name that path literally, and `load` resolves nothing, so BATS_LIB_PATH
      # cannot move the libraries anywhere cheaper.
      #
      # On a self-hosted runner, $HOME can outlive the job and be shared by
      # several repos' runners, so concurrent jobs meet at ~/.local/lib. Each
      # release is cloned once, into a directory named for its version, and
      # nothing that has been loaded from is ever removed. The clone is staged
      # beside its target and renamed into place, so a reader never sees a
      # partial one, and a job that loses the race keeps the winner's copy. The
      # path the suites load is a symlink to the pinned release, replaced by
      # rename. A new pin names a new directory, so a runner never serves the
      # tag it cloned first while CI reports the pin. A real directory at the
      # symlink's path cannot be renamed over, so it is removed first.
      #
      # The hook runs tests/*.bats, flat. Recursing would sweep an integration
      # tier in beside the unit one, and only the repo knows which of its tiers
      # is runner-safe. A nested layout is named in a notice rather than passed
      # over in silence.
      #
      # jq is installed ahead of the runner's own, because the scripts under
      # test evaluate jq programs and jq's grammar moves between releases. 1.8
      # accepts an object value piped into `//` without parentheses, and 1.7
      # rejects the whole program. The version is pinned to the jq developers
      # run locally, so a program parses here exactly when it parses there.
      #
      # yq and rg are installed for the same scripts, which read YAML and
      # search with them. A self-hosted runner image ships neither, so every
      # test reaching one exits 127. Each is pinned to the release developers
      # run, as jq is.
      #
      # A version names a release, not its bytes. A release asset can be
      # replaced and a tag moved after the pin was chosen, so each download is
      # checked against the sha256 the declaration records, and each clone's
      # HEAD against the commit its tag pointed at. A mismatch fails the job
      # before anything it fetched runs. A helper library already on a
      # self-hosted runner's disk is checked too, because it may predate the
      # check.
      - name: Set up bats
        run: |
          bats_version="1.14.0"
          bats_commit="eb7f42f8d608ac693d7a4b67474f6714ea68cfc5"
          bats_support_version="0.3.0"
          bats_support_commit="24a72e14349690bcbf7c151b9d2d1cdd32d36eb1"
          bats_assert_version="2.2.4"
          bats_assert_commit="f1e9280eaae8f86cbe278a687e6ba755bc802c1a"
          jq_version="1.8.2"
          jq_sha256="b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f"
          yq_version="4.54.1"
          yq_sha256="8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f"
          rg_version="15.2.0"
          rg_sha256="33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"

          if ! compgen -G "tests/*.bats" > /dev/null; then
            if [ -n "$(find tests -name '*.bats' -print -quit 2>/dev/null)" ]; then
              echo "::notice::bats suites exist under tests/ but none at its root, and the bats hook runs tests/*.bats only"
            fi
            exit 0
          fi

          at_commit() {
            actual=$(git -C "$1" rev-parse HEAD)
            [ "$actual" = "$2" ] && return 0
            echo "::error::$1 is at commit $actual, and the pin names $2"
            return 1
          }

          git clone --depth 1 --branch "v${bats_version}" \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          at_commit "$RUNNER_TEMP/bats" "$bats_commit"
          echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"

          lib="$HOME/.local/lib"
          mkdir -p "$lib"
          for helper in "bats-support:${bats_support_version}:${bats_support_commit}" \
            "bats-assert:${bats_assert_version}:${bats_assert_commit}"; do
            IFS=: read -r name version commit <<< "$helper"
            release="${name}-v${version}"
            if [ ! -d "$lib/$release" ]; then
              staged=$(mktemp -d "$lib/.$release.XXXXXX")
              git clone --depth 1 --branch "v${version}" \
                "https://github.com/bats-core/$name.git" "$staged"
              at_commit "$staged" "$commit" || { rm -rf "$staged"; exit 1; }
              mv -T "$staged" "$lib/$release" 2>/dev/null || rm -rf "$staged"
            fi
            at_commit "$lib/$release" "$commit"
            [ -L "$lib/$name" ] || rm -rf "${lib:?}/$name"
            ln -s "$release" "$lib/.$name.$$"
            mv -T "$lib/.$name.$$" "$lib/$name"
          done

          mkdir -p "$RUNNER_TEMP/jq"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/jq/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${jq_version}/jq-linux-amd64"
          echo "${jq_sha256}  $RUNNER_TEMP/jq/jq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jq/jq"
          echo "$RUNNER_TEMP/jq" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/jq/jq" --version

          mkdir -p "$RUNNER_TEMP/yq"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/yq/yq" \
            "https://github.com/mikefarah/yq/releases/download/v${yq_version}/yq_linux_amd64"
          echo "${yq_sha256}  $RUNNER_TEMP/yq/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq/yq"
          echo "$RUNNER_TEMP/yq" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yq/yq" --version

          rg_release="ripgrep-${rg_version}-x86_64-unknown-linux-musl"
          mkdir -p "$RUNNER_TEMP/rg"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rg/${rg_release}.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${rg_version}/${rg_release}.tar.gz"
          echo "${rg_sha256}  $RUNNER_TEMP/rg/${rg_release}.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rg/${rg_release}.tar.gz" -C "$RUNNER_TEMP/rg" --strip-components=1 "${rg_release}/rg"
          rm "$RUNNER_TEMP/rg/${rg_release}.tar.gz"
          echo "$RUNNER_TEMP/rg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/rg/rg" --version

      # Over what the push or pull request changed, which is what the hooks
      # would have seen at commit time. --all-files would fail a push on every
      # finding in a file it never touched, so it is the scope only where no
      # earlier commit can be fetched, as on a repo's first push.
      #
      # Or where the change touches a file that configures a hook or pins what
      # it checks against: the hook config, a tool's config, a manifest, a lock
      # or a toolchain file. None of those matches a hook's own file types, so
      # a new release or rule would otherwise grade nothing in the commit that
      # brought it, and its findings would land on the next author to touch the
      # code.
      #
      # The checkout is one commit deep, and diffing needs one more. pre-commit
      # falls back to a two-dot diff where the two commits share no history on
      # disk, and refcheck's --moves reads the range as a two-dot diff too, so
      # the base commit alone is enough.
      #
      # The scope is chosen once, and written to a file beside the script every
      # hook's step runs, so each hook checks the same files.
      - name: Choose the files the hooks check
        id: hook-scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          from=
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 --no-tags origin "$BASE" 2>/dev/null; then
            from=$BASE
            reason="the change from ${BASE:0:12}"
          elif git fetch --quiet --depth=2 --no-tags origin "$(git rev-parse HEAD)" &&
            git rev-parse --quiet --verify HEAD~1 >/dev/null; then
            echo "::notice::this event names no base commit, so only the head commit's change is checked"
            from=HEAD~1
            reason="the head commit's change, because this event names no base commit"
          else
            echo "::notice::no earlier commit to diff against, so every file is checked"
            reason="every file, because there is no earlier commit to diff against"
          fi
          scope=(--all-files)
          if [ -n "$from" ]; then
            scope=(--from-ref "$from" --to-ref HEAD)
            while IFS= read -r changed; do
              case "${changed##*/}" in
                .pre-commit-config.yaml | .editorconfig | .codespellrc | .markdownlint.yaml | \
                  .shellcheckrc | .golangci.yml | .sqlfluff | .tflint.hcl | .prettierrc.yaml | \
                  .prettierignore | rustfmt.toml | .rustfmt.toml | \
                  eslint.config.* | tsconfig*.json | stylua.toml | .stylua.toml | \
                  pyproject.toml | uv.lock | go.mod | go.sum | Cargo.toml | Cargo.lock | \
                  rust-toolchain.toml | package.json | package-lock.json | .nvmrc | .terraform.lock.hcl)
                  echo "::notice::$changed changed, so every file is checked"
                  scope=(--all-files)
                  reason="every file, because $changed changed"
                  break
                  ;;
              esac
            done < <(git diff --name-only "$from" HEAD)
          fi
          printf '%s\n' "${scope[@]}" > "$RUNNER_TEMP/hook-scope"
          echo "$reason" > "$RUNNER_TEMP/hook-scope-reason"
          : > "$RUNNER_TEMP/hook-results"
          echo "The hooks check $reason."

          # pre-commit builds each `language: python` hook on the interpreter
          # running it. Left to uv, that is whatever Python the runner ships,
          # so pre-commit runs on the declared floor instead.
          #
          # setup-go exports GOTOOLCHAIN=local, and this job sets Go up once per
          # module. Under local, a later setup-go ignores its go.mod's toolchain
          # line, and each module's go refuses a go.mod asking for a newer
          # release. auto lets each module's go switch to the toolchain its
          # go.mod names. It is exported in the script, where no GITHUB_ENV
          # write can override it.
          #
          # A hook that passes prints a line ending in Passed, and one with no
          # files to check prints Skipped, both exiting 0.
          cat > "$RUNNER_TEMP/run-hook" <<'SCRIPT'
          hook=$1
          export GOTOOLCHAIN=auto
          mapfile -t scope < "$RUNNER_TEMP/hook-scope"
          output=$(mktemp)
          start=$EPOCHREALTIME
          uvx --python 3.13 pre-commit run "$hook" "${scope[@]}" --show-diff-on-failure 2>&1 | tee "$output"
          status=${PIPESTATUS[0]}
          seconds=$(awk -v start="$start" -v end="$EPOCHREALTIME" 'BEGIN { printf "%.1f", end - start }')
          if [ "$status" -ne 0 ]; then
            result=failed
          elif grep -q 'Passed$' "$output"; then
            result=passed
          else
            result=skipped
          fi
          printf '| `%s` | %s | %s |\n' "$hook" "$result" "$seconds" >> "$RUNNER_TEMP/hook-results"
          exit "$status"
          SCRIPT

      # One step per hook, so the run's listing names each hook, how long it
      # took and whether it failed. Each runs whatever the hooks before it
      # found, so one push reports every failing hook rather than the first.
      # None runs where a step before the scope failed.
      #
      # GITHUB_TOKEN is for the tflint hook, whose --init installs the plugins a
      # .tflint.hcl names from GitHub, which rate-limits a runner that does not
      # authenticate.
      - name: pre-commit run check-yaml
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" check-yaml

      - name: pre-commit run check-toml
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" check-toml

      - name: pre-commit run check-json
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" check-json

      - name: pre-commit run end-of-file-fixer
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" end-of-file-fixer

      - name: pre-commit run trailing-whitespace
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" trailing-whitespace

      - name: pre-commit run check-executables-have-shebangs
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" check-executables-have-shebangs

      - name: pre-commit run check-shebang-scripts-are-executable
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" check-shebang-scripts-are-executable

      - name: pre-commit run check-added-large-files
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" check-added-large-files

      - name: pre-commit run check-merge-conflict
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" check-merge-conflict

      - name: pre-commit run mixed-line-ending
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" mixed-line-ending

      - name: pre-commit run check-case-conflict
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" check-case-conflict

      - name: pre-commit run detect-private-key
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" detect-private-key

      - name: pre-commit run check-json5
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" check-json5

      - name: pre-commit run markdownlint
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" markdownlint

      - name: pre-commit run shellcheck
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" shellcheck

      - name: pre-commit run shfmt
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" shfmt

      - name: pre-commit run bats
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" bats

      - name: pre-commit run codespell
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" codespell

      - name: pre-commit run refcheck
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" refcheck

      - name: pre-commit run uv-lock
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" uv-lock

      - name: pre-commit run ruff-format
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" ruff-format

      - name: pre-commit run ruff-check
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" ruff-check

      - name: pre-commit run mypy
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" mypy

      - name: pre-commit run jactionlint
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" jactionlint

      - name: pre-commit run terraform_validate
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" terraform_validate

      - name: pre-commit run terraform_fmt
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" terraform_fmt

      - name: pre-commit run tflint
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" tflint

      - name: pre-commit run terraform-docs
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/run-hook" terraform-docs

      # The table on the run's summary page, one row per hook in the order they
      # ran. It is written once, from the rows each hook's step kept, so the
      # table is one piece of markdown.
      - name: Summarize the hooks
        if: ${{ !cancelled() && steps.hook-scope.outcome == 'success' }}
        run: |
          {
            echo "### pre-commit hooks"
            echo
            echo "Checked $(cat "$RUNNER_TEMP/hook-scope-reason")."
            echo
            echo "| Hook | Result | Seconds |"
            echo "| --- | --- | ---: |"
            cat "$RUNNER_TEMP/hook-results"
          } | tee -a "$GITHUB_STEP_SUMMARY"
