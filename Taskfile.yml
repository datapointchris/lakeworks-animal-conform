version: '3'

# Deploying is left out on purpose. An apply changes a live account, and a task name makes that
# one keystroke from `task test`. README.md's "Starting from scratch" carries the apply commands.

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install pyspark at the Glue pin and the dev tools, then the git hooks
    cmds:
      - uv sync --all-extras
      - uvx pre-commit install --hook-type pre-commit --hook-type commit-msg

  test:
    desc: Run the pytest suite. Arguments after -- go to pytest
    cmds:
      - uv run --all-extras pytest {{.CLI_ARGS}}

  lint:
    desc: Run ruff's checks, its format check, mypy and terraform fmt's check, writing no file
    cmds:
      - uv run --all-extras ruff check .
      - uv run --all-extras ruff format --check .
      - task: typecheck
      - terraform -chdir=infra fmt -check

  typecheck:
    desc: Type-check the job and the tests with mypy
    cmds:
      - uv run --all-extras mypy .

  format:
    desc: Rewrite files with ruff's formatter, its autofixes and terraform fmt
    cmds:
      - uv run --all-extras ruff format .
      - uv run --all-extras ruff check --fix .
      - terraform -chdir=infra fmt

  infra:validate:
    desc: Resolve the providers and naming module without a backend, then validate infra against pipeline.yml
    cmds:
      - terraform -chdir=infra init -backend=false
      - terraform -chdir=infra validate
