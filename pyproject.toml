[project]
name = "lakeworks-animal-conform"
version = "0.1.0"
description = "Conform heterogeneous shelter feeds into the animal domain event model."
requires-python = ">=3.11"          # Glue 5.0 ships Python 3.11; a higher floor cannot run there

# Pinned by tag, never by branch. A pipeline floating on main gets a different library on every
# deploy, and the resulting failure looks like a data problem rather than a dependency one.
dependencies = [
    "lakeworks @ git+https://github.com/datapointchris/lakeworks-platform-lib@v0.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pyspark==3.5.4",               # matches Glue 5.0 exactly
    "pytest>=8.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling refuses a PEP 508 direct reference unless this is set. The pin is a git tag by
# design: this is a deployed job, never a published package, so a direct reference costs nothing.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["jobs"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
known-first-party = ["lakeworks"]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
[tool.pytest.ini_options]
testpaths = ["tests"]
verbosity_assertions = 2
minversion = "8.0"

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true

[tool.codespell]
check-filenames = true

[tool.forge]
# Keys the shared toolchain standard owns, written by its generator.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]
