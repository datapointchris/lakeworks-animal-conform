# forge-toolchain: 32
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  python:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # > custom:before:python - reach the private dependencies
      # checkout attaches the job token to this repo's gitdir alone, through an
      # includeIf. uv resolves `lakeworks` by cloning into its own cache, where
      # that scoping does not reach, and git then asks for a username on a
      # terminal that is not there.
      #
      # Rewriting the URL carries the token into every clone the job makes,
      # whatever tool starts it. --global lands in the temporary config
      # checkout points GIT_CONFIG_GLOBAL at, so nothing survives the job.
      - name: Carry the job token into nested clones
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # generated:python
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Before the sync, which would rewrite a stale lock rather than fail on
      # it. uvx, so the uv is the one the uv-lock hook pins.
      - run: uvx uv@0.12.24 lock --check

      - run: uv sync --all-extras --dev

      # uvx, not `uv run` — the latter resolves ruff from the repo's own
      # dependencies, and a repo treating ruff as an installed tool rather than a
      # project dependency does not declare it. The version is the one the
      # pre-commit hook pins, so the two cannot disagree about a finding.
      - run: uvx ruff@0.12.5 check .

      - run: uvx ruff@0.12.5 format --check .

      # Declaring mypy as a dependency is the opt-in, and `uv run` is the same
      # invocation the pre-commit hook uses, so a repo passing locally passes
      # here. A [tool.mypy] section is not the opt-in: the standard pyproject
      # template writes one into every repo, infra repos included, and those
      # have nothing importable to check.
      # Tested by import rather than `mypy --version`: `uv run` falls back to
      # PATH, so a machine with mypy installed globally reports it present in a
      # repo that never declared it, and the check would pass locally while
      # behaving differently on a clean runner.
      - name: Type check
        run: |
          if uv run python -c "import mypy" >/dev/null 2>&1; then
            uv run mypy . --install-types --non-interactive
          else
            echo "mypy not a project dependency; skipping"
          fi

      # --with pytest, unlike the mypy step above, because skipping is the wrong
      # answer here: a repo with a real test suite that never declared pytest as
      # a dependency would silently stop being tested. Supplying the runner runs
      # the tests; a suite needing plugins still declares those itself.
      #
      # pytest exits 5 when it collects nothing, which is not a failure for a
      # repo that has no tests yet. Written explicitly rather than as an && chain
      # because the runner uses `bash -e`, where the concise form depends on
      # subtle errexit-exemption rules.
      - name: Test
        run: |
          set +e
          uv run --with pytest pytest
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then exit 0; fi
          exit 1

  terraform-infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:

      - uses: actions/checkout@v7

      # > custom:before:terraform-infra - reach the private module
      # `terraform init` clones the naming module into .terraform/modules,
      # which is a new repository and so outside the includeIf checkout scopes
      # the job token to.
      - name: Carry the job token into nested clones
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # generated:terraform-infra
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

      # init without a backend: validate needs the providers resolved, and no
      # PR check should be touching real state.
      - run: terraform init -backend=false

      - run: terraform validate

      # Unconditional: with no .tftest.hcl files this exits 0 reporting
      # "0 passed, 0 failed", so a repo without tests is unaffected.
      - run: terraform test

      # The hook runs whichever tflint a workstation has, so the pin is the
      # versions file's own. --init installs the plugins a .tflint.hcl names,
      # from GitHub, which rate-limits a runner that does not authenticate.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint_version="0.64.0"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tflint.zip" \
            "https://github.com/terraform-linters/tflint/releases/download/v${tflint_version}/tflint_linux_amd64.zip"
          unzip -o -q "$RUNNER_TEMP/tflint.zip" -d "$RUNNER_TEMP/tflint"
          tflint_bin="$RUNNER_TEMP/tflint/tflint"
          "$tflint_bin" --version
          "$tflint_bin" --init
          "$tflint_bin" --recursive

      # The terraform_docs hook writes only into a README.md already holding
      # its begin marker, so only those are checked. md, --anchor=false and
      # --html=false are the formatter and arguments the hook passes.
      - name: terraform-docs
        run: |
          terraform_docs_version="0.24.0"
          curl -fsSL --retry 3 "https://github.com/terraform-docs/terraform-docs/releases/download/v${terraform_docs_version}/terraform-docs-v${terraform_docs_version}-linux-amd64.tar.gz" \
            | tar -xzf - -C "$RUNNER_TEMP" terraform-docs
          terraform_docs_bin="$RUNNER_TEMP/terraform-docs"
          "$terraform_docs_bin" --version

          status=0
          for readme in $(git ls-files README.md '*/README.md'); do
            grep -q '<!-- BEGIN_TF_DOCS -->' "$readme" || continue
            "$terraform_docs_bin" md --output-file README.md --output-mode inject --output-check \
              --anchor=false --html=false "$(dirname "$readme")" || status=1
          done
          exit "$status"

  hooks:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # generated:hooks
      # The hooks no other job in this workflow runs, which forge lists below
      # from the repo's committed config. A push from a checkout that never ran
      # `pre-commit install`, or a merge in the web UI, passes every hook by not
      # running it, and this is the gate that catches both.
      - uses: astral-sh/setup-uv@v7

      # A self-hosted runner keeps ~/.cache/pre-commit between jobs, so there
      # the archive is a download of what is already on disk.
      - uses: actions/cache@v6
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Over what the push or pull request changed, which is what the hooks
      # would have seen at commit time. --all-files would fail a push on every
      # finding in a file it never touched, so it is the scope only where no
      # earlier commit can be fetched, as on a repo's first push.
      #
      # The checkout is one commit deep, and diffing needs one more. pre-commit
      # falls back to a two-dot diff where the two commits share no history on
      # disk, and refcheck's --moves reads the range as a two-dot diff too, so
      # the base commit alone is enough.
      - name: Run the hooks over the change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 --no-tags origin "$BASE" 2>/dev/null; then
            scope=(--from-ref "$BASE" --to-ref HEAD)
          elif git fetch --quiet --depth=2 --no-tags origin "$(git rev-parse HEAD)" &&
            git rev-parse --quiet --verify HEAD~1 >/dev/null; then
            echo "::notice::this event names no base commit, so only the head commit's change is checked"
            scope=(--from-ref HEAD~1 --to-ref HEAD)
          else
            echo "::notice::no earlier commit to diff against, so every file is checked"
            scope=(--all-files)
          fi
          hooks=(
            check-yaml
            check-toml
            check-json
            end-of-file-fixer
            trailing-whitespace
            check-executables-have-shebangs
            check-shebang-scripts-are-executable
            check-added-large-files
            check-merge-conflict
            mixed-line-ending
            check-case-conflict
            detect-private-key
            check-json5
            markdownlint
            shellcheck
            shfmt
            codespell
            refcheck
            actionlint
          )
          # Every hook runs whatever the one before it found, so one push
          # reports every failing hook rather than the first.
          status=0
          for hook in "${hooks[@]}"; do
            uvx pre-commit run "$hook" "${scope[@]}" --show-diff-on-failure || status=1
          done
          exit "$status"
